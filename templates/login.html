<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập hệ thống</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="min-h-screen bg-gray-100 flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-gray-200 p-8">
        <div class="mb-8 text-center">
            <h1 class="text-2xl font-bold text-gray-900">Đăng nhập hệ thống</h1>
            <p class="text-sm text-gray-500 mt-2">Dùng cho Admin và CTV</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="mb-5 space-y-2">
                {% for category, message in messages %}
                    <div class="p-3 rounded-lg text-sm font-semibold {{ 'bg-green-100 text-green-700 border border-green-200' if category == 'success' else ('bg-yellow-100 text-yellow-700 border border-yellow-200' if category == 'warning' else 'bg-red-100 text-red-700 border border-red-200') }}">{{ message }}</div>
                {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Username</label>
                <input type="text" name="username" required class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Password</label>
                <input type="password" name="password" required class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <button type="submit" class="w-full bg-gray-900 hover:bg-black text-white rounded-xl py-3 font-bold transition-all">Đăng nhập</button>
        </form>
    </div>
</body>
</html>
