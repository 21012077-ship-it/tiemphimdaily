services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: netflix_manager
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    depends_on:
      - db
    env_file:
      - .env
    ports:
      - "8000:8000"
    command: sh -c "sleep 5 && gunicorn -w 2 -b 0.0.0.0:8000 --timeout 120 app:app"

volumes:
  postgres_data: